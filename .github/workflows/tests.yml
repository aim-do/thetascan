name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e '.[benchmark]'
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - name: Validate built wheel in an isolated environment
        run: |
          python -m venv --system-site-packages .artifact-venv
          .artifact-venv/bin/python -m pip install --force-reinstall --no-deps dist/*.whl
          .artifact-venv/bin/python -c "import thetascan; assert thetascan.__version__ == '0.1.0'"
      - name: Validate source-distribution release links
        run: |
          mkdir .sdist-check
          tar -xzf dist/*.tar.gz -C .sdist-check
          cd .sdist-check/thetascan-*
          python -m unittest tests.test_release_hygiene -v
      - run: python examples/configure_mixer.py --recipe gn-reference-v0.1
      - run: python examples/configure_mixer.py --recipe gn-expanded-reference-v0.1
      - run: python examples/configure_mixer.py --recipe kernel-expanded-reference-v0.1
