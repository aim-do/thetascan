[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "thetascan"
version = "0.1.0"
description = "Scan-parallel nonlinear-memory mixers with GN and normalized-kernel APIs"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ultimamind SRL", email = "hi@aim.do" }]
license = "PolyForm-Small-Business-1.0.0"
license-files = ["LICENSE", "NOTICE", "LICENSING.md", "PATENTS.md", "THIRD_PARTY_NOTICES.md", "licenses/*"]
dependencies = ["torch>=2.4"]
keywords = ["sequence-modeling", "nonlinear-memory", "kernel-regression", "fast-weights"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
fla = ["flash-linear-attention"]
benchmark = ["tomli>=2; python_version < '3.11'"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
